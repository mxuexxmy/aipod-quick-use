  <!-- 设置弹窗 -->
  <div class="modal-mask" id="settingsModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="设置" tabindex="-1">
      <div class="modal-head">
        <h3>设置</h3>
        <button class="icon-btn" data-close-modal="settingsModal" title="关闭" aria-label="关闭设置">
          <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label class="field-label">服务连接方式</label>
          <label class="radio-row">
            <input type="radio" name="svcMode" value="default" checked>
            <div>
              <strong>默认服务（推荐）</strong>
              <p>直连算力舱官方 Ollama 地址（<code>https://ollama-ai.盒子域名</code>），算力舱默认已放行跨域访问。</p>
            </div>
          </label>
          <label class="radio-row">
            <input type="radio" name="svcMode" value="custom">
            <div>
              <strong>自定义服务地址</strong>
              <p>适用于非默认服务名或多个算力舱，例如 <code>https://f-1420225016421-ollama-ai.你的盒子名.heiyu.space</code>。将直连该地址，需目标服务允许跨域（OLLAMA_ORIGINS）。</p>
            </div>
          </label>
        </div>
        <div class="field" id="customBaseField" hidden>
          <label class="field-label" for="customBaseInput">服务基础地址（不含 /api 或 /v1）</label>
          <input type="text" id="customBaseInput" placeholder="https://f-123456-ollama-ai.你的盒子名.heiyu.space">
        </div>
        <p class="hint">提示：在地址栏加上 <code>?mock=1</code> 可进入演示模式，无需算力舱即可体验全部功能。</p>
      </div>
      <div class="modal-foot">
        <button class="btn" data-close-modal="settingsModal">取消</button>
        <button class="btn btn-primary" id="settingsSave">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
